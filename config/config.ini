# 穿越火线比赛配置。比赛前请按实际赛场、摄像头位置、舵机中位与安全阈值标定。
# 场地尺寸只提供合法范围内的场地配置元数据； timed maneuver duration 仍需按实车/场地标定。
MODE=race
FIELD_LENGTH_M=7.0
FIELD_WIDTH_M=4.0

# Hardware-matched UVC camera profile: camera I supports 1280x720@30fps.
# Select the real path using: v4l2-ctl --list-devices. If path is empty, CAM_DEV is used.
# CAM_W/H are processing dimensions. All pixel thresholds/ROI values below are in the
# PIXEL_REF_W x PIXEL_REF_H reference coordinate system and are scaled automatically.
CAM_DEV=2
CAM_W=1280
CAM_H=720
CAM_FPS=30
PIXEL_REF_W=640
PIXEL_REF_H=480
ROI_X1=20
ROI_Y1=180
ROI_X2=620
ROI_Y2=440
CAMERA_DEVICE_PATH=/dev/video2

# ROI and pixel thresholds below are calibrated against 640x480; loader scales them to CAM_W/H.
# Do not manually scale these values when changing to the 1920x1080 camera profile.
# HSV thresholds (OpenCV hue range 0..180)
BLUE_H_LOW=95
BLUE_H_HIGH=132
BLUE_S_LOW=100
BLUE_V_LOW=55
RED1_H_LOW=0
RED1_H_HIGH=10
RED1_S_LOW=90
RED1_V_LOW=65
RED2_H_LOW=170
RED2_H_HIGH=180
RED2_S_LOW=90
RED2_V_LOW=65
COLOR_CARD_THRESHOLD=0.60
COLOR_STABLE_FRAMES=3
MORPH_KERNEL_SIZE=5
MORPHOLOGY_ITERATIONS=1

# Cone shape filtering
MIN_AREA_BLUE=25
MIN_AREA_RED=30
MIN_CONT_W=7
MIN_CONT_H=6
ASPECT_MIN=0.2
ASPECT_MAX=1.8
FILL_MIN=0.08
FILL_MAX=0.82
TOP_EXCLUDE_GLOBAL_Y=230
CONE_EDGE_MARGIN_PX=1
CONE_SHAPE_MIN_HEIGHT=28
CONE_BOTTOM_BAND_MIN_PX=3
CONE_BOTTOM_BAND_MAX_PX=14
CONE_BOTTOM_BAND_HEIGHT_DIVISOR=5
CONE_BOTTOM_MIN_WIDTH=7
CONE_MID_MIN_WIDTH=5
CONE_BOTTOM_WIDTH_RATIO=1.05
CONE_MID_WIDTH_RATIO=0.60
ROW_TOLERANCE=35
MIN_GAP_WIDTH=45
MAX_GAP_WIDTH=200
RED_BLOCK_BELOW=40
RED_CORRIDOR_MARGIN=10
RED_MISS_CONFIRM_FRAMES=3
RED_TRACK_MATCH_RADIUS_PX=45
RED_UNCERTAIN_EDGE_PX=12
RED_CONFIDENCE_THRESHOLD=0.25

# PWM values in microseconds; verify ESC neutral value and servo direction before wheels-up test
MOTOR_CHANNEL=1
SERVO_CHANNEL=0
GIMBAL_YAW_CHANNEL=2
GIMBAL_PITCH_CHANNEL=3
GIMBAL_YAW_US=1500
GIMBAL_PITCH_US=1350
MOTOR_PULSE_MIN_US=1000
MOTOR_PULSE_MAX_US=2500
PWM_PULSE_MIN_US=500
PWM_PULSE_MAX_US=2500
SPEED_RUN=1670
SPEED_APPROACH=1630
SPEED_SEARCH=1615
SPEED_STOP=1600
STATION_MOTOR_SPEED=1660
ALIGN_MOTOR_SPEED=1640
SERVO_MID=1455
SERVO_LEFT=2000
SERVO_RIGHT=1000
MOTOR_SLEW_US_PER_CYCLE=12
SERVO_SLEW_US_PER_CYCLE=40

# PID
KP=0.6
KI=0.0
KD=0.1
OUT_MAX=800
OUT_MIN=-800
ERR_INT_MAX=30
ERR_INT_MIN=-30
SERVO_GAIN=-2.0
HEAD_DEADZONE=8.0
HEAD_GAIN=6.0
HEAD_PROTECT=75.0
ALIGN_TOLERANCE_DEG=3.0
ALIGN_P_GAIN=10.0
ALIGN_STABLE_FRAMES=3

# Route mapping and exact speech text. BLUE/RED -> route/station/camp is an editable assumption.
BLUE_ROUTE=A
RED_ROUTE=B
TTS_A=我将前往路线A，到达据点A并穿越雷区返回营地A
TTS_B=我将前往路线B，到达据点B并穿越雷区返回营地B
VOICE_TIMEOUT_MS=8000

# Calibrated timed maneuvers (not odometry/localization)
BLUE_LEG1_SERVO=1700
BLUE_LEG2_SERVO=1300
BLUE_LEG1_MS=1700
BLUE_LEG2_MS=500
BLUE_SINGLE_SERVO=1520
BLUE_NO_SAFE_SERVO=1480
BLUE_HEADING_OFFSET_DEG=-20
RED_LEG1_SERVO=1300
RED_LEG2_SERVO=1700
RED_LEG1_MS=1700
RED_LEG2_MS=500
RED_SINGLE_SERVO=1430
RED_NO_SAFE_SERVO=1520
RED_HEADING_OFFSET_DEG=13
STATION_STAY_MS=3000

# Camp approach/parking
CAMP_MIN_RATIO=0.06
CAMP_MAX_RATIO=0.25
CAMP_SLOW_RATIO=0.12
CAMP_MIN_GLOBAL_Y=250
STOP_AREA_RATIO=0.24
STOP_CENTER_TOL=30
STOP_FRAMES_NEED=3
CAMP_LOST_GRACE_FRAMES=5
CAMP_CENTER_BYPASS_FACTOR=1.20

# Vision-based proximity proxies; NOT physical contact sensors. Must be calibrated on the car.
RED_HIT_Y=380
RED_HIT_DX=40
BLUE_HIT_Y=380
BLUE_HIT_DX=40
CONTACT_EVENT_COOLDOWN_MS=1000
FENCE_PROXY_ENABLED=1
FENCE_EDGE_STRIP_PX=18
FENCE_BOTTOM_BAND_PX=24
FENCE_EDGE_DARK_RATIO=0.90
FENCE_OPPOSITE_EDGE_MAX_RATIO=0.65
DARK_THRESHOLD_V=70

# Robustness / timeouts
FRAME_BRIGHTNESS_MIN=8
FRAME_BRIGHTNESS_MAX=248
MAX_BRIGHTNESS_DELTA=75
BAD_FRAME_LIMIT=8
MAX_CAMERA_MISSES=3
CAMERA_REOPEN_ATTEMPTS=3
CAMERA_REOPEN_INTERVAL_MS=500
MAX_IMU_MISSES=5
MAX_NO_CONE_FRAMES=40
CONE_LOSS_STOP_FRAMES=4
STATION_LEG_TIMEOUT_MS=10000
ALIGN_TIMEOUT_MS=4000
TRACK_TIMEOUT_MS=60000
MISSION_TIMEOUT_MS=180000
LOOP_SLEEP_MS=10

# HAL
IMU_DEVICE=/dev/ttyS0
IMU_BAUD=9600
IMU_CALIBRATION_SAMPLES=8
VOLTAGE_NOMINAL_V=12.6
VOLTAGE_MIN_V=9.0
VOLTAGE_MAX_V=13.5
EVENT_LOG_PATH=logs/crossfire_events.csv

# Legacy network values retained for migration only; race application intentionally starts no UDP listener.
PC_HOST=192.168.137.1
ORANGEPI_IP=192.168.137.86
SEND_PORT=8766
RECV_PORT=8767
